[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrqn"
version = "1.0.0"
description = "Active Object Localization with redundant saliency priors and calibrated stopping"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["agrqn"]
