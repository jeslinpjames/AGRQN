[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrqn"
version = "1.0.0"
description = "AG-RQN: saliency priors, descriptor strength, and selective stopping in active object localization (TMLR 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["agrqn"]
